spring:
    jpa:
        database: MYSQL
        show-sql: true
        hibernate:
            ddl-auto: update

    flyway:
        enabled: true
        locations: classpath:db/migration

# Configuracao de desearializacao do JSON: Caso o JSON tenha propriedades que nao existam na classe, o Jackson vai reclamar
    jackson:
        deserialization:
            fail-on-unknown-properties: true

    cloud:
        azure:
            keyvault.secret.endpoint: ${APP_CONFIGURATION_ENDPOINT}

#Defini quais endpoints deve ser exebidos na documentacao
springdoc:
    packages-to-scan: com.algaworks.algamoney_api.algamoney_api.resource


